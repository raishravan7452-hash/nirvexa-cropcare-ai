<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CropCare AI – Nirvexa prototype</title>
<style>
:root{--bg:#f1f4ee;--card:#fff;--ink:#1f2a1d;--mute:#5d6b59;--pri:#1e5b4a;--on:#fff;--acc:#e3a72f;--line:#d6ddd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#172019;--card:#222d24;--ink:#eaf0e6;--mute:#a2b19d;--pri:#63b79d;--on:#102019;--line:#34443a}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Devanagari",system-ui,sans-serif}
main{max-width:440px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 0;letter-spacing:-.3px}.sub{color:var(--mute);margin:2px 0 14px}
.langs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.langs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px}
.langs button[aria-pressed=true]{background:var(--pri);color:var(--on);border-color:var(--pri)}
.drop{display:grid;place-items:center;min-height:190px;border:2px dashed var(--pri);border-radius:14px;background:var(--card);overflow:hidden;cursor:pointer;text-align:center;color:var(--pri);font-weight:600}
.drop img{width:100%;max-height:260px;object-fit:cover}
.row{display:flex;gap:8px;margin:10px 0}
.btn{flex:1;border:0;border-radius:12px;padding:13px 10px;font:inherit;font-weight:600;background:var(--pri);color:var(--on)}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.go{background:var(--acc);color:#2b2000}
button:focus-visible,.drop:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.heard{color:var(--mute);font-size:14px;min-height:20px}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;display:none}
.res h2{font-size:19px;margin:0 0 4px}.bar{height:8px;border-radius:4px;background:var(--line);margin:6px 0 10px}.bar i{display:block;height:100%;border-radius:4px;background:var(--pri)}
.res small{color:var(--mute)}.note{font-size:12.5px;color:var(--mute);text-align:center;margin-top:16px}
</style></head><body><main>
<h1 id="t"></h1><p class="sub" id="s"></p>
<div class="langs" id="langs" role="group" aria-label="Language"></div>
<label class="drop" id="drop" tabindex="0"><span id="u"></span><input id="f" type="file" accept="image/*" capture="environment" hidden></label>
<div class="row"><button class="btn go" id="scan"></button><button class="btn alt" id="demo"></button></div>
<div class="row"><button class="btn alt" id="mic"></button></div>
<div class="heard" id="heard" aria-live="polite"></div>
<section class="res" id="res" aria-live="polite">
<small id="rl"></small><h2 id="dn"></h2><small><span id="cl"></span>: <b id="cv"></b></small><div class="bar"><i id="cb"></i></div>
<small id="rml"></small><p id="rem" style="margin:2px 0 12px"></p><button class="btn" id="say"></button></section>
<p class="note" id="n"></p></main>
<script>
const L={en:{n:"English",v:"en-IN",t:"CropCare AI",s:"Snap a photo, get the diagnosis",u:"Take or upload a photo",d:"Try a sample",m:"Speak symptoms",r:"Diagnosis",rm:"Remedy",l:"Read aloud",c:"Confidence",x:"Check disease",N:"Demo prototype: results are simulated",h:"Heard"},
kn:{n:"ಕನ್ನಡ",v:"kn-IN",t:"ಕ್ರಾಪ್‌ಕೇರ್ AI",s:"ಫೋಟೋ ತೆಗೆಯಿರಿ, ರೋಗ ತಿಳಿಯಿರಿ",u:"ಫೋಟೋ ತೆಗೆಯಿರಿ / ಅಪ್‌ಲೋಡ್",d:"ಮಾದರಿ ಪ್ರಯತ್ನಿಸಿ",m:"ಲಕ್ಷಣ ಹೇಳಿ",r:"ರೋಗ ಪತ್ತೆ",rm:"ಪರಿಹಾರ",l:"ಓದಿ ಹೇಳು",c:"ನಿಖರತೆ",x:"ರೋಗ ಪರೀಕ್ಷಿಸಿ",N:"ಡೆಮೊ ಮಾದರಿ: ಫಲಿತಾಂಶಗಳು ಅಣಕು",h:"ಕೇಳಿದ್ದು"},
tcy:{n:"ತುಳು",v:"kn-IN",t:"ಕ್ರಾಪ್‌ಕೇರ್ AI",s:"ಫೋಟೊ ದೆಪ್ಪುಲೆ, ರೋಗ ತೆರಿಲೆ",u:"ಫೋಟೊ ದೆಪ್ಪುಲೆ / ಅಪ್‌ಲೋಡ್ ಮನ್ಪುಲೆ",d:"ಮಾದರಿ ತೂಲೆ",m:"ಲಕ್ಷಣ ಪನ್ಲೆ",r:"ರೋಗ ಪತ್ತೆ",rm:"ಪರಿಹಾರ",l:"ಓದ್ಲೆ",c:"ಖಚಿತತೆ",x:"ರೋಗ ತೂಲೆ",N:"ಡೆಮೊ: ಫಲಿತಾಂಶ ನಕಲಿ",h:"ಕೇಂಡ್ಂಡ್"},
hi:{n:"हिन्दी",v:"hi-IN",t:"क्रॉपकेयर AI",s:"फोटो लें, रोग जानें",u:"फोटो लें / अपलोड करें",d:"नमूना आज़माएँ",m:"लक्षण बोलें",r:"निदान",rm:"उपाय",l:"पढ़कर सुनाएँ",c:"विश्वसनीयता",x:"रोग जाँचें",N:"डेमो प्रोटोटाइप: परिणाम नकली हैं",h:"सुना"},
ml:{n:"മലയാളം",v:"ml-IN",t:"ക്രോപ്പ്കെയർ AI",s:"ഫോട്ടോ എടുക്കൂ, രോഗം അറിയൂ",u:"ഫോട്ടോ എടുക്കുക / അപ്‌ലോഡ്",d:"സാമ്പിൾ നോക്കൂ",m:"ലക്ഷണം പറയൂ",r:"രോഗനിർണയം",rm:"പരിഹാരം",l:"വായിച്ചു കേൾപ്പിക്കൂ",c:"കൃത്യത",x:"രോഗം പരിശോധിക്കൂ",N:"ഡെമോ: ഫലങ്ങൾ അനുകരണം",h:"കേട്ടത്"}};
const D=[
{en:["Arecanut Koleroga (fruit rot)","Spray 1% Bordeaux mixture on bunches before monsoon; remove and burn fallen infected nuts."],kn:["ಅಡಿಕೆ ಕೊಳೆರೋಗ","ಮಳೆಗಾಲದ ಮೊದಲು ಗೊನೆಗಳಿಗೆ ಶೇ.1 ಬೋರ್ಡೋ ದ್ರಾವಣ ಸಿಂಪಡಿಸಿ; ಬಿದ್ದ ರೋಗಪೀಡಿತ ಕಾಯಿಗಳನ್ನು ಸುಟ್ಟುಹಾಕಿ."],tcy:["ಬಜ್ಜಯಿ ಕೊಳೆ ರೋಗ","ಮುಂಗಾರು ಬರ್ಪಿನೆಡ್ದ್ ದುಂಬು ಬಜ್ಜಯಿ ಗೊಂಚಿಲೆಗ್ 1% ಬೋರ್ಡೊ ಮಿಶ್ರಣ ತಲ್ಪುಲೆ; ಬೂರ್ದಿನ ಲಕ್ಷಣ ಇತ್ತಿನ ಬಜ್ಜಯಿಲೆನ್ ತೂಟು ಪಾಡ್ಲೆ."],hi:["सुपारी कोलेरोगा (फल सड़न)","मानसून से पहले गुच्छों पर 1% बोर्डो मिश्रण छिड़कें; गिरे संक्रमित फल जला दें."],ml:["അടയ്ക്ക കൊളെരോഗം (മഹാളി)","മഴയ്ക്കു മുൻപ് കുലകളിൽ 1% ബോർഡോ മിശ്രിതം തളിക്കുക; വീണ രോഗബാധിത കായ്കൾ കത്തിക്കുക."],k:/rot|areca|nut|ಬಜ್ಜಯಿ|adike|kole|ಅಡಿಕೆ|ಕೊಳೆ|सुपारी|അടയ്ക്ക/i},
{en:["Coconut Bud Rot","Remove rotten tissue, apply 1% Bordeaux paste, and protect the crown from rain."],kn:["ತೆಂಗಿನ ಮೊಗ್ಗು ಕೊಳೆ ರೋಗ","ಕೊಳೆತ ಭಾಗ ತೆಗೆದು ಶೇ.1 ಬೋರ್ಡೋ ಲೇಪನ ಹಚ್ಚಿ; ಮಳೆಯಿಂದ ಮಡಿಲು ರಕ್ಷಿಸಿ."],tcy:["ತೆಂಗಿನ ಸುಳಿ ಕೊಳೆ ರೋಗ","ಕುಡ್ತಿನ ಭಾಗೊನು ದೆತ್ತ್‌ದ್, 1% ಬೋರ್ಡೊ ಪೇಸ್ಟ್ ಪೂಜುಲೆ, ತೆಂಗಿನ ಸುಳಿಕ್ಕ್ ಪೆರ ನೆಂಪುನ ತಡೆಪುಲೆ."],hi:["नारियल कली सड़न","सड़ा भाग हटाकर 1% बोर्डो पेस्ट लगाएँ; शीर्ष को बारिश से बचाएँ."],ml:["തെങ്ങിൻ മുകുളചീയൽ","ചീഞ്ഞ ഭാഗം നീക്കി 1% ബോർഡോ പേസ്റ്റ് പുരട്ടുക; കൂമ്പ് മഴയിൽനിന്ന് സംരക്ഷിക്കുക."],k:/coco|bud|ಸುಳಿ|taare|moggu|ತೆಂಗು|ತೆಂಗಿನ|नारियल|തെങ്ങ്/i},
{en:["Cashew Anthracnose","Prune affected shoots and spray a copper-based fungicide; ask your Krishi Vigyan Kendra for the dose."],kn:["ಗೇರು ಆಂಥ್ರಾಕ್ನೋಸ್","ಬಾಧಿತ ಕೊಂಬೆ ಕತ್ತರಿಸಿ ತಾಮ್ರ ಆಧಾರಿತ ಶಿಲೀಂಧ್ರನಾಶಕ ಸಿಂಪಡಿಸಿ; ಪ್ರಮಾಣಕ್ಕೆ ಕೃಷಿ ವಿಜ್ಞಾನ ಕೇಂದ್ರ ಸಂಪರ್ಕಿಸಿ."],tcy:["ಗೇರು ಆಂಥ್ರಾಕ್ನೋಸ್ (ಗೇರು ಕೊಂಬೆ ಒಣಗು ರೋಗ)","ರೋಗ ಬತ್ತಿನ ಕೊಂಬೆಲೆನ್ ಕತ್ತರ್ದ್ ದೆತ್ತ್‌ದ್ ತಾಮ್ರದ ಮರ್ದ್ ತಲ್ಪುಲೆ; ಇಂದೆತ ಪ್ರಮಾಣಕ್ಕ್ ಕೈತಲ್ದ ಕೃಷಿ ವಿಜ್ಞಾನ ಕೇಂದ್ರದಕುಲೆನ್ ಕೇನೆಲೆ."],hi:["काजू एन्थ्रेक्नोज","प्रभावित टहनियाँ काटें और तांबा-आधारित फफूंदनाशक छिड़कें; मात्रा के लिए कृषि विज्ञान केंद्र से पूछें."],ml:["കശുമാവ് ആന്ത്രാക്നോസ്","ബാധിച്ച കൊമ്പുകൾ മുറിച്ച് ചെമ്പ് അടിസ്ഥാനമാക്കിയ കുമിൾനാശിനി തളിക്കുക; അളവിന് കൃഷി വിജ്ഞാന കേന്ദ്രത്തെ സമീപിക്കുക."],k:/cashew|geeru|korant|ಗೇರು|काजू|കശു/i}];
const $=i=>document.getElementById(i);let lg="en",cur=null,img=false;
function ui(){const o=L[lg];[["t","t"],["s","s"],["scan","x"],["demo","d"],["mic","m"],["rl","r"],["rml","rm"],["say","l"],["cl","c"],["n","N"]].forEach(([a,b])=>$(a).textContent=o[b]);
$("u").textContent=o.u;document.documentElement.lang=lg==="tcy"?"kn":lg;
$("langs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===lg));show()}
function show(){if(cur==null)return;const d=D[cur.i][lg];$("dn").textContent=d[0];$("rem").textContent=d[1];$("cv").textContent=cur.c+"%";$("cb").style.width=cur.c+"%";$("res").style.display="block"}
function run(i){cur={i:i??Math.floor(Math.random()*3),c:78+Math.floor(Math.random()*19)};show()}
Object.keys(L).forEach(k=>{const b=document.createElement("button");b.textContent=L[k].n;b.dataset.k=k;b.onclick=()=>{lg=k;ui()};$("langs").appendChild(b)});
$("f").onchange=e=>{const f=e.target.files[0];if(!f)return;img=true;const m=document.createElement("img");m.src=URL.createObjectURL(f);m.alt="";$("drop").querySelector("img")?.remove();$("drop").prepend(m);$("u").hidden=true;run()};
$("scan").onclick=()=>run();$("demo").onclick=()=>run();
$("say").onclick=()=>{try{const d=D[cur.i][lg],u=new SpeechSynthesisUtterance(d[0]+". "+d[1]);u.lang=L[lg].v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
$("mic").onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$("heard").textContent="Voice input is not supported in this browser. Try Chrome on Android.";return}
const r=new R();r.lang=L[lg].v;$("heard").textContent="…";r.onresult=e=>{const tx=e.results[0][0].transcript;$("heard").textContent=L[lg].h+": “"+tx+"”";const i=D.findIndex(d=>d.k.test(tx));run(i<0?0:i)};r.onerror=()=>{$("heard").textContent="Could not hear you. Try again."};r.start()};
ui();
</script></body></html>
